<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Calorie Counter{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>

    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Fraunces:wght@700&display=swap"
        rel="stylesheet">
    <style>
        body {
            font-family: 'DM Sans', sans-serif;
        }

        h1, h2 {
            font-family: 'Fraunces', serif;
        }
    </style>

</head>

<body class="bg-amber-50 min-h-screen text-stone-800">
    <header class="bg-white border-b border-stone-200 shadow-sm">
        <div class="max-w-3xl mx-auto px-6 py-4 flex items-center justify-between">
            <h1 class="text-2xl font-bold text-stone-800 tracking-tight">Calorie Counter</h1>
            <p class="text-xs text-stone-400 font-medium uppercase tracking-widest">Track · Eat · Thrive</p>
        </div>
    </header>


    <main class="max-w-3xl mx-auto px-6 py-10">
        {% block content %}

        {% endblock %}
    </main>

    <footer class="text-center text-stone-400 text-sm py-8">
        &copy; 2026 Calorie Counter. All rights reserved. Eat well, live well!
    </footer>


</body>

</html>
