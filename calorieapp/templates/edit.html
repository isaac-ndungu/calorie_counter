{% extends 'base.html' %}

{% block title %}Edit Meal{% endblock %}

{% block content %}

    <!-- Back link -->
    <a href="{% url 'index' %}" class="inline-flex items-center gap-1.5 text-stone-400 hover:text-amber-600 text-sm font-medium mb-6 transition-colors duration-100">
        ← Back to Meals
    </a>

    <div class="bg-white rounded-2xl shadow-sm border border-stone-200 p-8 max-w-lg">
        <h2 class="text-3xl font-bold text-stone-800 mb-1">Edit Meal</h2>
        <p class="text-stone-400 text-sm mb-8">Update the details below and save.</p>

        <form method="POST" action="/update/{{ meal.id }}/" class="space-y-5">
            {% csrf_token %}

            <!-- Meal ID -->
            <div>
                <label class="block text-xs font-semibold text-stone-400 uppercase tracking-wider mb-1">Meal ID</label>
                <p class="text-stone-500 text-sm font-mono bg-stone-50 border border-stone-200 rounded-lg px-4 py-2.5">{{ meal.id }}</p>
            </div>

            <!-- Name field -->
            <div>
                <label class="block text-sm font-semibold text-stone-600 mb-1.5" for="name">Meal Name</label>
                <input
                    type="text"
                    id="name"
                    name="name"
                    value="{{ meal.name }}"
                    required
                    class="w-full border border-stone-300 rounded-xl px-4 py-2.5 text-stone-800 placeholder-stone-300 focus:outline-none focus:ring-2 focus:ring-amber-400 focus:border-transparent transition"
                >
            </div>

            <!-- Calories field -->
            <div>
                <label class="block text-sm font-semibold text-stone-600 mb-1.5" for="calories">Calories (kcal)</label>
                <input
                    type="number"
                    id="calories"
                    name="calories"
                    value="{{ meal.calories }}"
                    required
                    class="w-full border border-stone-300 rounded-xl px-4 py-2.5 text-stone-800 placeholder-stone-300 focus:outline-none focus:ring-2 focus:ring-amber-400 focus:border-transparent transition"
                >
            </div>

            <!-- Message -->
            {% if message %}
            <div class="bg-green-50 border border-green-200 text-green-700 text-sm rounded-xl px-4 py-3">
                {{ message }}
            </div>
            {% endif %}

            <!-- Submit -->
            <button
                type="submit"
                class="w-full bg-amber-500 hover:bg-amber-600 text-white font-semibold py-3 rounded-xl shadow-sm transition-colors duration-150">
                Update Meal
            </button>
        </form>
    </div>

{% endblock %}
